    cx = 1296.0
    cy = 400.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "weather"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        background = false
        color = "primary"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000004]
    box_height = 352.0
    box_width = 496.0
    cx = 1280.0
    cy = 1232.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "media_player"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000004.settings]
        background = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000005]
    box_height = 128.0
    box_width = 496.0
    cx = 1280.0
    cy = 1360.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000005.settings]
        background = false
        bands = 76.0
        show_when_idle = false

[nightlight]
enabled = true

[osd]
keyboard_layout = false
position = "bottom_center"

[plugins]
enabled = [ "noctalia/bongocat" ]

[shell]
avatar_path = "/home/dankuri/.face.png"
clipboard_enabled = false
password_style = "random"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = true
ui_scale = 1.1499999761581421

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    session_search = true

    [shell.panel]
    open_near_click_session = true

    [shell.privacy]
    mic_filter_regex = "gsr-.*"

    [shell.screenshot]
    annotate = true
    directory = "/home/dankuri/Pictures/Screenshots"
    remember_last_region = true
    show_cursor = true

[templates]

[theme]
builtin = "Catppuccin"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]
    enable_community_templates = false

[wallpaper]
directory = "/home/dankuri/Pictures/Wallpapers"

[weather]
auto_locate = true

[widget.audio_visualizer]
high_color = "error"

[widget.brightness]
show_label = false

[widget.cat]
audio_spectrum = true
enable_scroll = false
rave_mode = true
tappy_mode = true
type = "noctalia/bongocat:cat"
use_mpris_filter = true

[widget.clock]
anchor = true
format = "{:%H:%M • %a %d}"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.privacy]
hide_inactive = true

[widget.volume]
show_label = false
